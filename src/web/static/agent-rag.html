<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinRisk 智能体审查演示</title>
<style>
body{margin:0;background:#f4f7f9;color:#243447;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:40px auto;padding:0 24px}h1{font-size:29px;margin:0}p{margin:10px 0}.sub{color:#65768a}.notice{background:#fff5df;border-left:4px solid #dfa94e;padding:12px 18px;margin:24px 0}.panel,.card{background:#fff;border:1px solid #dde5ed;border-radius:12px;padding:24px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:145px;border:1px solid #c5d1dc;border-radius:8px;padding:14px;font:inherit;resize:vertical}button,select{font:inherit;border-radius:7px;padding:9px 16px;border:1px solid #bfccd9;background:#fff;cursor:pointer}button.primary{background:#176b72;color:#fff;border:0}button:disabled{opacity:.5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.tag{display:inline-block;padding:3px 10px;background:#e9f2f3;color:#176b72;border-radius:14px;margin:4px}.pending{background:#fff5df;color:#90631b}blockquote{border-left:3px solid #71a4aa;margin:14px 0;padding:8px 15px;background:#f6f9fa;white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-word;font:14px/1.7 system-ui}.small{font-size:14px;color:#65768a}.error{color:#b83e41}a{color:#176b72}h2{font-size:21px;margin:0 0 14px}details{margin-top:15px}
</style>
<main>
<h1>材料审查 · 智能体初代</h1>
<p class="sub">原文、风险标签与处罚参照，一起查看。</p>
<div class="notice">当前使用<strong>模拟模型</strong>验证运行流程。公开包默认检索的是合成案例，不是真实处罚决定；页面意见仅用于流程演示。</div>
<section class="panel"><h2>输入材料</h2><textarea id="material" placeholder="输入一句或一段保险材料"></textarea>
<div class="row"><select id="engine"><option value="controlled_agent">智能体流程</option><option value="fixed_rag">固定检索对照</option></select><button id="sample">填入赠礼演示样例</button><button class="primary" id="run">开始演示</button></div><p id="status" class="small" role="status"></p><p id="progressLine" class="small"></p><details id="progressDetails" hidden><summary>查看最近10个状态变化</summary><ol id="progressHistory" class="small"></ol></details></section>
<section id="result" hidden></section><section class="panel" id="source" hidden><h2>处罚原文</h2><p id="sourceMeta" class="small"></p><pre id="sourceText"></pre></section>
</main>
<script src="/agent-rag/progress-view.js"></script>
<script>
const el=id=>document.getElementById(id);let taskId=null,scenario="generic",running=false;
const names={suspected:"疑似风险",no_clear_risk:"未发现明确风险",review_required:"需要复核",completed:"流程完成",partial:"部分完成",failed:"执行失败",interrupted:"执行中断",no_reliable_match:"尚无可靠案例支持",not_completed:"案例核对未完成",partial_match:"部分相似",reliable_match:"可靠相似",not_required:"无需处罚参照"};
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
el("sample").onclick=()=>{el("material").value="购买这份保险就送购物卡。";scenario="gift-example"};el("material").oninput=()=>scenario="generic";
async function json(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw new Error(typeof value.detail==="string"?value.detail:JSON.stringify(value.detail||value));return value}
function renderProgress(task){el("progressLine").textContent=FinRiskProgress.statusLine(task.progress,task.task_status);const history=task.progress_history||[];el("progressDetails").hidden=!history.length;el("progressHistory").replaceChildren(...history.map(snapshot=>node("li",FinRiskProgress.historyLine(snapshot))))}
function render(report){const target=el("result");target.replaceChildren();target.hidden=false;
const overview=node("div","","panel");overview.append(node("h2",names[report.overall_judgment]||report.overall_judgment),node("p",report.summary),node("p",`${names[report.task_status]} · 已处理${report.coverage.reviewed_segment_ids.length}/${report.coverage.provided_segment_ids.length}段 · ${report.simulated?"模拟结果":"模型结果"}`,"small"));target.append(overview);
for(const point of report.risk_points){const card=node("div","","card");card.append(node("h2",point.mechanism),node("p",names[point.judgment]||point.judgment));for(const tag of point.supported_tags)card.append(node("span",tag,"tag"));for(const tag of point.pending_tags)card.append(node("span",tag+" · 待核条件","tag pending"));for(const span of point.input_spans)card.append(node("blockquote",span.quote));for(const check of point.tag_checks)card.append(node("p",check.tag+"："+check.reason));card.append(node("p",names[point.case_match_status]||point.case_match_status,"small"));for(const warning of point.context_warnings||[])card.append(node("p",warning,"small"));for(const unknown of point.unknowns)card.append(node("p","待复核："+unknown,"small"));target.append(card)}
const evidence=report.retrieved_evidence.filter(e=>e.source_kind==="penalty");if(evidence.length){const panel=node("div","","panel");panel.append(node("h2","检索到的处罚参照"),node("p","这些是待核对的原文片段，检索排名不能证明违规机制相同。","small"));const shown=new Set();for(const e of evidence){if(shown.has(e.source_id))continue;shown.add(e.source_id);panel.append(node("blockquote",e.quote));const b=node("button","查看来源与上下文");b.onclick=()=>showSource(e.source_id);panel.append(b)}target.append(panel)}
const detail=node("details","");detail.append(node("summary","查看运行记录"),node("pre",JSON.stringify({versions:report.versions,resources:report.resources,validation:report.validation,stop:report.stop},null,2)));target.append(detail)}
async function showSource(sourceId){try{const value=await json(`/api/agent-rag/tasks/${taskId}/source/${encodeURIComponent(sourceId)}`);if(value.status==="error")throw new Error(value.error.code);el("source").hidden=false;const e=value.data.evidence;el("sourceMeta").textContent=`来源 ${sourceId} · 原文位置 ${e.start}–${e.end} · 已核验冻结文本哈希`;el("sourceText").textContent=e.quote+(value.data.has_more?"\n\n后续还有原文。":"");el("source").scrollIntoView({behavior:"smooth"})}catch(error){el("status").textContent=error.message}}
el("run").onclick=async()=>{if(running)return;running=true;el("run").disabled=true;el("result").hidden=true;el("source").hidden=true;el("status").className="small";el("status").textContent="正在提交材料……";el("progressLine").textContent="";el("progressDetails").hidden=true;try{const value=await json("/api/agent-rag/tasks",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":crypto.randomUUID()},body:JSON.stringify({text:el("material").value,engine:el("engine").value,mock_scenario:scenario})});taskId=value.task_id;for(let n=0;n<120;n++){const task=await json(value.poll_url);renderProgress(task);if(task.report){render(task.report);el("status").textContent=FinRiskProgress.completionText(task);break}if(["failed","interrupted","rejected"].includes(task.task_status)){el("status").textContent=FinRiskProgress.completionText(task);el("status").className="error";break}el("status").textContent="正在处理材料，当前步骤与预算见下方。";if(n===119)throw new Error("等待超时；任务不会因此自动重跑。");await new Promise(r=>setTimeout(r,1000))}}catch(error){el("status").textContent=error.message;el("status").className="error"}finally{running=false;el("run").disabled=false}};
</script>
</html>
